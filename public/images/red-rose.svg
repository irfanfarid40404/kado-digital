<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Petal Gradients -->
    <radialGradient id="roseCenterGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff2e55"/>
      <stop offset="50%" stop-color="#d61b40"/>
      <stop offset="100%" stop-color="#800a26"/>
    </radialGradient>
    <linearGradient id="rosePetalGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4d6d"/>
      <stop offset="50%" stop-color="#e6193c"/>
      <stop offset="100%" stop-color="#8f0b25"/>
    </linearGradient>
    <linearGradient id="rosePetalGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff6b8b"/>
      <stop offset="60%" stop-color="#c91838"/>
      <stop offset="100%" stop-color="#73071e"/>
    </linearGradient>
    
    <!-- Leaf Gradients -->
    <linearGradient id="leafGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#52b788"/>
      <stop offset="60%" stop-color="#2d6a4f"/>
      <stop offset="100%" stop-color="#1b4332"/>
    </linearGradient>
    <linearGradient id="leafGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#74c69d"/>
      <stop offset="70%" stop-color="#40916c"/>
      <stop offset="100%" stop-color="#1b4332"/>
    </linearGradient>
    <linearGradient id="stemGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#40916c"/>
      <stop offset="50%" stop-color="#52b788"/>
      <stop offset="100%" stop-color="#1b4332"/>
    </linearGradient>

    <!-- Dew Drop Glow -->
    <radialGradient id="dewDropGrad" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#d61b40" stop-opacity="0.1"/>
    </radialGradient>
    
    <!-- Shadow Filter -->
    <filter id="roseShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g filter="url(#roseShadow)">
    <!-- Stem -->
    <path d="M260 340 Q255 410 240 470" stroke="url(#stemGrad)" stroke-width="12" stroke-linecap="round" fill="none"/>

    <!-- Left Leaf -->
    <g transform="translate(140, 260) rotate(-25)">
      <path d="M0 40 Q50 0 110 30 Q60 80 0 40Z" fill="url(#leafGrad1)" stroke="#1b4332" stroke-width="1.5"/>
      <path d="M0 40 Q55 35 110 30" stroke="#74c69d" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6"/>
    </g>

    <!-- Right Top Leaf -->
    <g transform="translate(280, 200) rotate(20)">
      <path d="M0 40 Q60 -10 130 20 Q70 90 0 40Z" fill="url(#leafGrad2)" stroke="#1b4332" stroke-width="1.5"/>
      <path d="M0 40 Q65 25 130 20" stroke="#95d5b2" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6"/>
    </g>

    <!-- Outer Rose Petals Layer 1 -->
    <path d="M120 280 C80 200 130 130 210 140 C280 120 380 160 370 260 C360 340 260 370 180 340 C130 320 100 300 120 280Z" fill="url(#rosePetalGrad1)"/>

    <!-- Outer Petals Layer 2 (Flared Petals) -->
    <path d="M110 240 C90 180 150 120 230 110 C320 100 410 170 390 250 C370 310 280 350 200 330 C130 310 90 270 110 240Z" fill="url(#rosePetalGrad2)"/>

    <!-- Mid Petal Clusters -->
    <path d="M150 220 C140 170 200 120 260 130 C320 140 370 190 350 250 C330 300 260 320 200 300 C160 280 140 240 150 220Z" fill="url(#rosePetalGrad1)"/>
    <path d="M170 200 C160 160 210 130 270 140 C320 150 350 190 330 240 C310 280 250 290 210 280 C180 270 165 230 170 200Z" fill="url(#rosePetalGrad2)"/>

    <!-- Inner Rose Cup & Spiral Center -->
    <path d="M200 180 C190 150 230 130 270 140 C300 150 320 180 300 210 C280 240 240 250 210 240 C190 230 185 200 200 180Z" fill="url(#roseCenterGrad)"/>
    <circle cx="250" cy="190" r="30" fill="url(#rosePetalGrad1)"/>
    <path d="M240 180 C250 170 265 170 270 185 C275 200 255 210 240 195 Z" fill="#ff758f"/>

    <!-- Realistic Water Dew Drops on Petals -->
    <g class="dew-drops">
      <!-- Dew Drop 1 (Bottom Left Petal) -->
      <ellipse cx="180" cy="300" rx="8" ry="6" fill="url(#dewDropGrad)" stroke="rgba(255,255,255,0.8)" stroke-width="0.8"/>
      <circle cx="178" cy="298" r="2.5" fill="#ffffff"/>

      <!-- Dew Drop 2 (Right Outer Petal) -->
      <ellipse cx="350" cy="220" rx="10" ry="7" fill="url(#dewDropGrad)" stroke="rgba(255,255,255,0.8)" stroke-width="0.8"/>
      <circle cx="348" cy="218" r="3" fill="#ffffff"/>

      <!-- Dew Drop 3 (Mid Left Petal) -->
      <ellipse cx="160" cy="230" rx="7" ry="5" fill="url(#dewDropGrad)" stroke="rgba(255,255,255,0.8)" stroke-width="0.8"/>
      <circle cx="159" cy="229" r="2" fill="#ffffff"/>

      <!-- Dew Drop 4 (Bottom Right Petal) -->
      <ellipse cx="280" cy="310" rx="9" ry="6" fill="url(#dewDropGrad)" stroke="rgba(255,255,255,0.8)" stroke-width="0.8"/>
      <circle cx="278" cy="308" r="2.5" fill="#ffffff"/>
    </g>
  </g>
</svg>
